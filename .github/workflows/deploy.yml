name: CI/CD Deployment

# Même chaîne que norde.be : image construite sur GitHub, poussée sur GHCR,
# puis tirée par le serveur (Tailscale + SSH) et relancée avec docker compose.
on:
    push:
        branches:
            - staging # Déclenche la PREPROD (staging)
            # - master  # À décommenter quand la prod sera prête (secrets SSH_HOST, SSH_KEY, ENV_FILE_PROD)
    workflow_dispatch:

# Un seul déploiement à la fois par branche : le suivant attend la fin du précédent
concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/zwarmex/raphael-monguillon
    APP_DIR: /srv/apps/feretfeu

jobs:
    # 0. Vérifications : lint et types, avant de construire quoi que ce soit
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npx next typegen && npx tsc --noEmit

    # 1. Construction de l'image sur les runners GitHub, poussée sur GHCR.
    #    Le serveur ne compile rien : il tire l'image et redémarre.
    build:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Next lit NEXT_PUBLIC_SITE_URL et SITE_ENV au build : on passe le bon .env
            # en secret BuildKit (jamais écrit dans une couche de l'image).
            - name: Write build env
              env:
                  ENV_FILE: ${{ github.ref_name == 'master' && secrets.ENV_FILE_PROD || secrets.ENV_FILE_PREPROD }}
              run: printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/env_local"

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ github.ref_name }}
                      ${{ env.IMAGE }}:${{ github.sha }}
                  secret-files: |
                      env_local=${{ runner.temp }}/env_local
                  # Cache par branche pour ne pas mélanger les builds prod/staging
                  cache-from: type=gha,scope=${{ github.ref_name }}
                  cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

    # 2. Déploiement : le serveur tire l'image et relance le conteneur
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        permissions:
            contents: read
            packages: read
        steps:
            # Uniquement pour les fichiers compose, copiés sur le serveur :
            # le code, lui, est déjà dans l'image GHCR.
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Connect to Tailscale
              uses: tailscale/github-action@v2
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  # Le tag est obligatoire avec OAuth car le client n'est pas un utilisateur
                  tags: tag:github-actions

            - name: Set Docker Variables
              run: |
                  if [[ $GITHUB_REF_NAME == 'master' ]]; then
                    echo "Environment: PRODUCTION"
                    echo "COMPOSE_FLAGS=-f docker-compose.yml -f docker-compose.prod.yml" >> $GITHUB_ENV
                  else
                    echo "Environment: STAGING"
                    echo "COMPOSE_FLAGS=-f docker-compose.yml -f docker-compose.staging.yml" >> $GITHUB_ENV
                  fi

            # Le .env voyage en base64 : guillemets, $ ou backticks dans les valeurs
            # ne sont pas interprétés par le shell du serveur.
            - name: Encode env file
              env:
                  ENV_FILE: ${{ github.ref_name == 'master' && secrets.ENV_FILE_PROD || secrets.ENV_FILE_PREPROD }}
              run: |
                  ENV_B64="$(printf '%s\n' "$ENV_FILE" | base64 -w0)"
                  echo "::add-mask::$ENV_B64"
                  echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"

            - name: Prepare app directory
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ github.ref_name == 'master' && secrets.SSH_HOST || secrets.DEV_SSH_HOST }}
                  key: ${{ github.ref_name == 'master' && secrets.SSH_KEY || secrets.DEV_SSH_KEY }}
                  username: ${{ secrets.SSH_USER }}
                  port: ${{ secrets.SSH_PORT }}
                  script: mkdir -p ${{ env.APP_DIR }}

            - name: Copy compose files
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
              with:
                  host: ${{ github.ref_name == 'master' && secrets.SSH_HOST || secrets.DEV_SSH_HOST }}
                  key: ${{ github.ref_name == 'master' && secrets.SSH_KEY || secrets.DEV_SSH_KEY }}
                  username: ${{ secrets.SSH_USER }}
                  port: ${{ secrets.SSH_PORT }}
                  source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.staging.yml"
                  target: ${{ env.APP_DIR }}

            - name: Deploy via SSH
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  host: ${{ github.ref_name == 'master' && secrets.SSH_HOST || secrets.DEV_SSH_HOST }}
                  key: ${{ github.ref_name == 'master' && secrets.SSH_KEY || secrets.DEV_SSH_KEY }}
                  username: ${{ secrets.SSH_USER }}
                  port: ${{ secrets.SSH_PORT }}
                  envs: GHCR_TOKEN,ENV_B64
                  script: |
                      set -e
                      cd ${{ env.APP_DIR }}

                      # 1. Injection du bon .env (lu à l'exécution via env_file)
                      printf '%s' "$ENV_B64" | base64 -d > .env.local
                      chmod 600 .env.local

                      COMPOSE="docker compose --env-file .env.local ${{ env.COMPOSE_FLAGS }}"

                      # 2. Récupération de l'image (token temporaire du job, retiré juste après)
                      export IMAGE_TAG=${{ github.sha }}
                      echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      $COMPOSE pull web
                      docker logout ghcr.io

                      # 3. Relance sans rebuild
                      $COMPOSE up -d --no-build --remove-orphans

                      # 4. Nettoyage (images non utilisées de plus de 3 jours : de quoi revenir en arrière)
                      docker image prune -af --filter "until=72h"
